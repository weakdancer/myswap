<div id="header">
<hr class="space"/>
<div class="span-2  ">
    &nbsp;
</div>
<div class="span-4 ">
<a class="button" href="/{% if settings %}{{ settings.username }}{% endif %}">
  myswap/首页
</a>
</div>
<div class="span-9 ">
    {% if msg_error %}
        <h1 class="error">{{ msg_error }}</h1>
    {% endif %}
    {% if msg_success %}
        <h1 class="success">{{ msg_success }}</h1>
    {% endif %}
    {% if msg_added %}
        <h1 class="added">{{ msg_added }}</h1>
    {% endif %}
</div>

<div class="span-3  right ">
  <a class="button" href="/Signup">signup/注册</a>
</div>

{% if settings %}
<div class="span-3  right ">
  <a class="button" href="/{{ settings.username }}/setting">setting/设置</a>
</div>
<div class="span-3  right ">
  <a class="button" href="/{{ settings.username }}?all=ture&display_content=false">lists/仅名称</a>
</div>
{% endif %}

<hr />
<hr class="space"/>
</div>
