<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="/" aria-label="myswap 首页"><span class="brand-symbol" aria-hidden="true">{{ icon('leaf') }}</span><span>myswap<span class="brand-dot">.</span></span></a>
        <span class="header-divider" aria-hidden="true"></span><span class="header-tagline">给文字一个生长的地方</span>
        <nav class="header-nav" aria-label="主导航">
            {% if settings %}
            <a href="/{{ settings.username }}" {% if request.endpoint == 'main.user_index' %}aria-current="page"{% endif %}>我的空间</a>
            <a href="/{{ settings.username }}/setting" {% if request.endpoint == 'main.setting' %}aria-current="page"{% endif %}>设置</a>
            <a class="avatar" href="/{{ settings.username }}" aria-label="{{ settings.username }} 的空间">{{ settings.username[:1]|upper }}</a>
            {% else %}
            <a href="/myswap/howto" {% if request.path == '/myswap/howto' %}aria-current="page"{% endif %}>使用指南</a>
            <a class="nav-about" href="/myswap/myswap-about">关于</a>
            <a class="button button-dark button-small" href="/Signup">创建空间 {{ icon('arrow-up') }}</a>
            {% endif %}
        </nav>
    </div>
</header>
